<!DOCTYPE html>
<html>
    <head>
        <title>Trainwreck comic website</title>
    </head>
    <link rel="stylesheet" href="../static/main.css">
    
    <body>
        <img class="logo" src="../static/trainwreck_logo.png">
        <a class="navbar_buttons" href="/trainwreck-comic/characters">Characters</a>
        <div>
            <img class="page" src="{{ page }}">
        </div>
        <div class="page_arrows_left">
            <a href="/trainwreck-comic/1">&lt;&lt;</a> First
            <a href="/trainwreck-comic/{{ page_num - 1 }}">&lt;</a> Previous
        </div>
        <div class="page_arrows_right">
            Next <a href="/trainwreck-comic/{{ page_num + 1 }}">&gt;</a>
            Newest <a href="/trainwreck-comic/{{ page_count }}">&gt;&gt;</a>
        </div>
    </body>
</html>
